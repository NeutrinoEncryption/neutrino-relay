# Example nginx site for neutrino-relay. TLS via certbot: `certbot --nginx -d relay.example.com`.
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
limit_conn_zone $binary_remote_addr zone=neutrino_relay_conn:10m;
limit_req_zone  $binary_remote_addr zone=neutrino_relay_req:10m rate=30r/m;

server {
    listen 80;
    server_name relay.example.com;

    location = /health { default_type text/plain; return 200 "ok\n"; }

    location /v1/relay {
        limit_conn neutrino_relay_conn 32;
        limit_req zone=neutrino_relay_req burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;   # no per-connection logs
    }

    location / { return 404; }
}
